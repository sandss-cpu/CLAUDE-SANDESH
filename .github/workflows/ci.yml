# Every push and pull request: install, typecheck (strict for new modules), unit tests,
# the IDOR suite against a fresh database, the website's tests, npm audit, both builds,
# and an OWASP ZAP baseline scan of the running web app, website and API. The scan fails
# the run on any high-risk finding; its counts are posted as annotations on the run.
name: CI

on:
  push:
    branches: [main, phase3]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: ci
      PGPASSWORD: ci
      DATABASE_URL: postgresql://ci:ci@localhost:5432/batoma_test?schema=public
      JWT_SECRET: ci-only-signing-secret-not-used-anywhere-else-0001
      E2E_ACCOUNTS: ${{ github.workspace }}/backend/test/.accounts.md
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            site/package-lock.json

      - name: Secrets for this run only
        run: |
          echo "FIELD_ENCRYPTION_KEYS=v1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BLIND_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SITE_API_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "SITE_DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Install (backend)
        working-directory: backend
        run: npm ci && npx prisma generate

      - name: Typecheck (and strictNullChecks for new modules)
        working-directory: backend
        run: npm run typecheck

      - name: Unit tests
        working-directory: backend
        run: npm test -- --ci

      - name: Audit production dependencies (backend)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Build (backend)
        working-directory: backend
        run: npm run build

      - name: Test database
        working-directory: backend
        run: bash scripts/test-db.sh

      - name: IDOR suite (every fleet, finance, trip, appraisal, document and partner route)
        working-directory: backend
        run: npm run test:e2e

      - name: Website database role
        working-directory: backend
        run: npm run db:site-role

      - name: Install, build and test (website)
        working-directory: site
        env:
          OWNER_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          DATABASE_URL="postgresql://batoma_site:${SITE_DB_PASSWORD}@localhost:5432/batoma_test?schema=public" npm test

      - name: Start the API, web app and website
        run: |
          (cd backend && THROTTLE_DISABLED=true PORT=3000 node dist/main.js > /tmp/api.log 2>&1 &)
          (node scripts/dev-web-server.mjs > /tmp/web.log 2>&1 &)
          (cd site && DATABASE_URL="postgresql://batoma_site:${SITE_DB_PASSWORD}@localhost:5432/batoma_test?schema=public" \
            API_URL=http://localhost:3000/api/v1 PORT=4000 node dist/src/server.js > /tmp/site.log 2>&1 &)
          for url in http://localhost:3000/health http://localhost:5173/ http://localhost:4000/healthz; do
            for i in $(seq 1 30); do curl -fsS "$url" > /dev/null && break; sleep 2; done
            curl -fsS "$url" > /dev/null || { echo "$url did not start"; cat /tmp/*.log; exit 1; }
          done

      - name: ZAP baseline (website)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:4000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-site
          cmd_options: '-a -j -J zap-site.json'

      - name: ZAP baseline (web app)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:5173
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-web
          cmd_options: '-a -j -J zap-web.json'

      - name: ZAP baseline (API)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000/health
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api
          cmd_options: '-a -J zap-api.json'

      - name: No high-risk findings
        run: node scripts/zap-summary.mjs zap-site.json zap-web.json zap-api.json
