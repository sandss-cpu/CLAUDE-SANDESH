/* ---------- session: 15-minute access token, rotated with the refresh token ---------- */
function tokenExpiresSoon(token){
  try{
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return payload.exp * 1000 - Date.now() < 30_000;
  }catch(_){
    return true;
  }
}

let refreshing = null;
/**
 * One refresh at a time, across every open tab. The server treats a reused
 * refresh token as stolen and ends the whole session, so two tabs refreshing
 * with the same token at once would sign the traveller out.
 */
function refreshSession(){
  if(refreshing) return refreshing;
  const run = async () => {
    const stored = JSON.parse(localStorage.getItem('bato.auth') || 'null');
    if(!stored?.refreshToken){ const e = new Error('signed out'); e.expired = true; throw e; }
    // Another tab may have rotated the token while this one waited for the lock.
    if(stored.accessToken !== state.auth?.accessToken && !tokenExpiresSoon(stored.accessToken)){
      state.auth = stored;
      return stored;
    }
    const res = await fetch(`${API}/auth/refresh`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: stored.refreshToken }),
    });
    if(!res.ok){
      const e = new Error('Could not refresh the session');
      e.expired = res.status === 401;
      throw e;
    }
    const { data } = await res.json();
    state.auth = { ...stored, accessToken: data.accessToken, refreshToken: data.refreshToken };
    localStorage.setItem('bato.auth', JSON.stringify(state.auth));
    return state.auth;
  };
  refreshing = (navigator.locks ? navigator.locks.request('bato-refresh', run) : run())
    .finally(() => { refreshing = null; });
  return refreshing;
}

/** fetch with the traveller's session: refreshes a stale token first, and retries once on 401. */
async function authed(url, opts = {}){
  if(!state.auth) return fetch(url, opts);
  const ended = () => { signOut(); return new Error('Your session ended. Sign in again to continue.'); };

  if(tokenExpiresSoon(state.auth.accessToken)){
    try{ await refreshSession(); }catch(err){ if(err.expired) throw ended(); }
  }
  const call = () => fetch(url, {
    ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${state.auth.accessToken}` },
  });
  let res = await call();
  if(res.status === 401){
    try{ await refreshSession(); }catch(err){ if(err.expired) throw ended(); throw err; }
    res = await call();
    if(res.status === 401) throw ended();
  }
  return res;
}

function timeAgo(iso){
  if(!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if(s < 60) return 'just now';
  if(s < 3600) return `${Math.floor(s / 60)} min ago`;
  if(s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if(s < 7 * 86400) return `${Math.floor(s / 86400)} d ago`;
  return new Date(iso).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });
}

function readTabs(){
  return `
    <div class="seg" role="tablist" aria-label="What to read">
      <button role="tab" aria-selected="${state.readTab !== 'vlogs'}" onclick="setReadTab('magazine')">Magazine</button>
      <button role="tab" aria-selected="${state.readTab === 'vlogs'}" onclick="setReadTab('vlogs')">Traveller vlogs</button>
    </div>`;
}
function setReadTab(tab){
  state.readTab = tab;
  try{ sessionStorage.setItem('bato.readTab', tab); }catch(_){}
  render();
}

async function loadVlogs(){
  const v = state.vlogs;
  if(v.loading) return;
  v.loading = true; v.error = '';
  try{
    if(!state.liveApi){
      v.items = DEMO_VLOGS; v.demo = true;
    }else{
      const res = await authed(`${API}/posts?limit=30`);
      const json = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(json?.message || 'Could not load traveller stories');
      v.items = json.data.items; v.demo = false;
    }
  }catch(err){
    v.error = state.online ? err.message : "You're offline. Traveller stories load when you have signal.";
  }finally{
    v.loading = false; v.loaded = true;
    if(state.screen === 'read' && state.readTab === 'vlogs') render();
  }
}

function voteBar(p){
  const busy = state.votePending[p.id] ? 'disabled' : '';
  const id = esc(p.id);
  return `
    <div class="vote-bar" role="group" aria-label="Vote on this story">
      <button class="vote up" aria-pressed="${p.myVote === 1}" ${busy}
              onclick="vote('${id}', ${p.myVote === 1 ? 0 : 1})"
              aria-label="Upvote. ${p.upvotes} upvote${p.upvotes === 1 ? '' : 's'}">
        <span aria-hidden="true">👍</span><b>${p.upvotes}</b></button>
      <button class="vote down" aria-pressed="${p.myVote === -1}" ${busy}
              onclick="vote('${id}', ${p.myVote === -1 ? 0 : -1})"
              aria-label="Downvote. ${p.downvotes} downvote${p.downvotes === 1 ? '' : 's'}">
        <span aria-hidden="true">👎</span><b>${p.downvotes}</b></button>
    </div>`;
}

function vlogCard(p){
  const cover = p.coverImageUrl
    ? `<img class="vlog-cover" src="${esc(p.coverImageUrl)}" alt="" loading="lazy">`
    : '';
  return `
    <article class="card vlog">
      <button class="vlog-open" onclick="openPost('${esc(p.id)}')"
              aria-label="Read ${esc(p.title)}, by ${esc(p.author?.name || 'a traveller')}">
        ${cover}
        <div class="card-body">
          <h3>${esc(p.title)}</h3>
          <div class="vlog-by">${esc(p.author?.name || 'Traveller')}${p.locationName ? ` · ${esc(p.locationName)}` : ''} · ${timeAgo(p.publishedAt)}</div>
          ${p.excerpt ? `<p>${esc(p.excerpt)}</p>` : ''}
        </div>
      </button>
      <div class="vlog-foot">
        ${voteBar(p)}
        <span class="vlog-foot-right">
          ${creatorLink(p.author)}
          ${p._count?.photos > 1 ? `<span class="vlog-photos">📷 ${p._count.photos} photos</span>` : ''}
          ${reportButton('POST', p.id)}
        </span>
      </div>
    </article>`;
}

/** Writers with an approved creator profile get a link to it from their stories. */
function creatorLink(author){
  const c = author?.creatorProfile;
  if(c?.status !== 'APPROVED') return '';
  return `<a class="vlog-photos" style="text-decoration:none" href="creator.html?handle=${encodeURIComponent(c.handle)}">@${esc(c.handle)}</a>`;
}

function vlogsFeed(){
  const v = state.vlogs;
  if(!v.loaded && !v.loading) loadVlogs();
  if(!v.loaded) {
    return `<div class="empty-state" role="status"><span class="spin"></span>Loading traveller stories…</div>`;
  }
  if(v.error && !v.items.length){
    return `
      <div class="empty-state">
        <p>${esc(v.error)}</p>
        <button class="btn btn-ghost" onclick="state.vlogs.loaded=false;render()">Try again</button>
      </div>`;
  }
  return `
    <div class="sec-head"><h2>From travellers</h2><span>Newest first</span></div>
    ${v.demo ? `<div class="offline-chip warn"><span class="dot"></span>
      <span>Sample stories. Connect to the server for live vlogs and voting.</span></div>` : ''}
    ${v.items.length ? interleaveAds(v.items.map(vlogCard), 'VLOG_FEED') : `
      <div class="empty-state">
        <p>No vlogs yet. Be the first to share a story from the road.</p>
      </div>`}
    <button class="btn btn-primary" style="margin:6px 0 10px" onclick="go('write')">Share your own story</button>`;
}

async function openPost(id){
  const fromList = state.vlogs.items.find((p) => p.id === id);
  state.post = fromList ? { ...fromList, body: fromList.excerpt, photos: [], partial: true } : null;
  go('post');
  if(state.vlogs.demo || !state.liveApi){
    if(state.post) state.post.partial = false;
    render();
    return;
  }
  try{
    const res = await authed(`${API}/posts/${encodeURIComponent(id)}`);
    const json = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(json?.message || 'Could not open this story');
    if(state.screen === 'post'){ state.post = json.data; render(); }
  }catch(err){
    toast(err.message);
    if(state.post){ state.post.partial = false; render(); }
  }
}

async function vote(id, value){
  if(state.vlogs.demo || !state.liveApi){ toast('Voting needs the live server'); return; }
  if(!state.auth){
    toast('Sign in to vote');
    setTimeout(() => { location.href = `login.html?returnTo=${encodeURIComponent('index.html#read')}`; }, 800);
    return;
  }
  if(state.votePending[id]) return;

  const targets = [state.vlogs.items.find((p) => p.id === id), state.post?.id === id ? state.post : null]
    .filter((p, i, all) => p && all.indexOf(p) === i);
  const before = targets.map((p) => ({ p, up: p.upvotes, down: p.downvotes, mine: p.myVote }));
  // Optimistic: the count moves on tap; it is corrected or rolled back when the server answers.
  for(const p of targets){
    if(p.myVote === 1) p.upvotes--;
    if(p.myVote === -1) p.downvotes--;
    if(value === 1) p.upvotes++;
    if(value === -1) p.downvotes++;
    p.myVote = value;
  }
  state.votePending[id] = true; render();

  try{
    const res = await authed(`${API}/posts/${encodeURIComponent(id)}/vote`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value }),
    });
    const json = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(json?.message || "Your vote didn't go through. Try again.");
    for(const p of targets){ p.upvotes = json.data.up; p.downvotes = json.data.down; p.myVote = json.data.myVote; }
  }catch(err){
    for(const b of before){ b.p.upvotes = b.up; b.p.downvotes = b.down; b.p.myVote = b.mine; }
    toast(err.message);
  }finally{
    delete state.votePending[id];
    render();
  }
}

async function loadMyPosts(){
  const m = state.myPosts;
  m.loading = true;
  try{
    const res = await authed(`${API}/posts/mine?limit=20`);
    const json = await res.json().catch(() => ({}));
    m.items = res.ok && Array.isArray(json.data) ? json.data : [];
  }catch(_){
    m.items = [];
  }finally{
    m.loading = false; m.loaded = true;
    if(state.screen === 'write') render();
  }
}

function myPostsSection(){
  const m = state.myPosts;
  if(!state.liveApi || !state.auth) return '';
  if(!m.loaded && !m.loading) loadMyPosts();
  if(!m.loaded || !m.items.length) return '';
  const label = (p) =>
    p.moderation === 'REJECTED' ? ['rejected', 'Not published']
    : p.status === 'PUBLISHED' && p.moderation === 'APPROVED' ? ['live', 'Live']
    : p.status === 'DRAFT' ? ['', 'Draft']
    : ['review', 'In review'];
  return `
    <div class="sec-head"><h2>Your stories</h2><span>${m.items.length}</span></div>
    <div class="card" style="padding:4px 16px">
      ${m.items.map((p) => {
        const [cls, text] = label(p);
        return `
          <div class="mine-row">
            <div style="min-width:0">
              <strong>${esc(p.title)}</strong>
              <small>${timeAgo(p.publishedAt || p.createdAt)} · 👍 ${p.upvotes} · 👎 ${p.downvotes}</small>
              ${p.moderation === 'REJECTED' && p.moderationNote
                ? `<small style="display:block">Moderator note: ${esc(p.moderationNote)}</small>` : ''}
            </div>
            <span class="status-pill ${cls}">${text}</span>
          </div>`;
      }).join('')}
    </div>`;
}

function setTemplate(v){ state.draft.template = v; render(); }
function persistDraft(){ localStorage.setItem('bato.draft', JSON.stringify(state.draft)); }
function saveDraft(){
  persistDraft();
  toast('Draft saved on this phone');
}

/* ---------- photos ---------- */
const MAX_PHOTOS = 10;

/**
 * Re-encode before upload. Smaller files matter on highway data, and
 * re-encoding drops EXIF metadata, which on a phone photo includes the exact
 * GPS position — the thing hideExactLocation exists to protect.
 */
async function prepareImage(file, maxDim = 1600){
  let bitmap;
  try{ bitmap = await createImageBitmap(file); }catch(_){ return file; }
  const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
  return blob ? new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
}

async function uploadImages(files){
  const form = new FormData();
  for(const f of files) form.append('files', await prepareImage(f));
  const res = await authed(`${API}/media/upload`, { method: 'POST', body: form });
  const json = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(json?.message || 'Upload failed. Please try again.');
  return json.data;
}

async function addPhotos(files){
  const d = state.draft;
  d.photos = d.photos || [];
  const room = MAX_PHOTOS - d.photos.length;
  if(!files.length) return;
  if(!state.online){ toast('Photos need a connection — add them when you have signal'); return; }
  if(!state.liveApi){ toast('Photo upload needs the live server'); return; }
  const batch = files.slice(0, room);
  if(files.length > room) toast(`Only ${room} more photo${room === 1 ? '' : 's'} fit in one story`);

  state.uploading = batch.length; render();
  try{
    const { files: saved, rejectedCount } = await uploadImages(batch);
    d.photos.push(...saved.map((f) => ({ url: f.url })));
    persistDraft();
    toast(rejectedCount
      ? `${saved.length} added · ${rejectedCount} skipped (not a real image)`
      : `${saved.length} photo${saved.length === 1 ? '' : 's'} added`);
  }catch(err){
    toast(err.message);
  }finally{
    state.uploading = 0;
    if(state.screen === 'write') render();
  }
}
function removePhoto(i){ state.draft.photos.splice(i, 1); persistDraft(); render(); }
function makeCover(i){
  const [photo] = state.draft.photos.splice(i, 1);
  state.draft.photos.unshift(photo);
  persistDraft(); render();
}

/** Post body the API expects, from the on-device draft. */
function draftPayload(){
  const d = state.draft;
  const photos = (d.photos || []).map((p) => ({ url: p.url }));
  return {
    title: d.title, body: d.body, template: d.template, locationName: d.place || undefined,
    photos: photos.length ? photos : undefined,
    coverImageUrl: photos[0]?.url,
  };
}

/** True network call, used only once the traveller has signed in. */
async function apiCreatePost(publishNow){
  const res = await authed(`${API}/posts${publishNow ? '/publish' : ''}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(draftPayload()),
  });
  const json = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(json?.message || 'Could not reach the server. Saved on this phone instead.');
  return json.data;
}

async function publish(){
  if(!state.draft.title.trim()){ toast('Give it a title first'); return; }
  if(!state.draft.body.trim()){ toast('Write a line or two about it first'); return; }
  if(state.uploading){ toast('Wait for your photos to finish uploading'); return; }
  if(state.publishing) return;
  persistDraft();

  // The draft is only cleared once the server has it, so a failed or offline
  // publish never loses what the traveller wrote.
  if(!state.online){ toast('No signal. Your draft is saved; publish when you have a connection.'); return; }
  if(!state.liveApi){ toast('Publishing needs the live server. Your draft is saved on this phone.'); return; }

  state.publishing = true; render();
  try{
    const post = await apiCreatePost(true);
    state.draft = { template:'FREEFORM', title:'', body:'', place:'', photos:[] };
    persistDraft();
    state.vlogs.loaded = false;
    state.myPosts.loaded = false;
    toast(post.moderation === 'APPROVED'
      ? "Published. It's live in Traveller vlogs."
      : "Sent for a quick check before it appears.");
    state.readTab = 'vlogs';
    state.publishing = false;
    go('read');
  }catch(err){
    state.publishing = false;
    toast(err.message);
    if(state.screen === 'write') render();
  }
}
function save(){ toast('Saved to your reading list'); }
function tripFromArticle(){
  state.trip = { ...DEMO.trip, title: 'Trip: ' + (state.article?.title.split(':')[0] || 'Bandipur') };
  toast('Trip created — edit anything');
  go('trip');
}
function getPack(i){
  const p = DEMO.packs[i];
  if(p.have){ toast('Already on this phone'); return; }
  toast(`Downloading ${p.name} — ${p.mb} MB`);
  setTimeout(() => { p.have = true; render(); toast(`${p.name} ready offline`); }, 1400);
}
function claim(){
  const code = Array.from({length:6}, () =>
    '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*32)]).join('');
  $('#cCode').textContent = code;
  toast('Show this code at the counter');
}
function lead(type){
  const msg = { CALL:'Calling…', WHATSAPP:'Opening WhatsApp…', DIRECTIONS:'Opening directions…' };
  toast(msg[type]);
  if(state.liveApi && state.business){
    fetch(`${API}/businesses/${state.business.slug}/lead`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ type, sessionId: state.session, routeId: state.route?.id }),
    }).catch(()=>{});
  }
}
function rate(btn){
  const n = Number(btn.dataset.n);
  btn.parentElement.querySelectorAll('.star').forEach(s => {
    s.textContent = Number(s.dataset.n) <= n ? '★' : '☆';
    s.style.color = Number(s.dataset.n) <= n ? 'var(--accent)' : '';
  });
}

/* ---------- listen mode ---------- */
function toggleAudio(){
  state.audio.playing ? stopAudio() : startAudio();
}
function startAudio(){
  state.audio.playing = true;
  const btn = $('#playBtn'); if(btn) btn.textContent = '❚❚';
  state.audio.timer = setInterval(() => {
    state.audio.pct = Math.min(100, state.audio.pct + 1.6);
    const bar = $('#prog'); if(bar) bar.style.width = state.audio.pct + '%';
    if(state.audio.pct >= 100) stopAudio();
  }, 180);
  toast('Narration playing');
}
function stopAudio(){
  clearInterval(state.audio.timer);
  state.audio.playing = false;
  const btn = $('#playBtn'); if(btn) btn.textContent = '▶';
}

/* ---------- appearance ---------- */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  localStorage.setItem('bato.theme', t);
  document.querySelector('meta[name=theme-color]')
    .setAttribute('content', t === 'night' ? '#141024' : '#5B3FA8');
  render();
}
function toggleMotion(){
  const off = document.documentElement.dataset.motion === 'off';
  document.documentElement.dataset.motion = off ? 'on' : 'off';
  localStorage.setItem('bato.motion', off ? 'on' : 'off');
  render();
}

/* ---------- install banner ---------- */
function maybeShowInstall(sessions){
  if(sessions < (state.promptFromSession || 2)) return;      // never on the first scan
  if(localStorage.getItem('bato.installDismissed')) return;
  setTimeout(() => $('#installBar').classList.add('show'), 3500);
}
$('#dismissInstall').onclick = () => {
  $('#installBar').classList.remove('show');
  localStorage.setItem('bato.installDismissed', '1');
};

/* ---------- boot ---------- */
(async function init(){
  const savedTheme = localStorage.getItem('bato.theme');
  if(savedTheme) document.documentElement.dataset.theme = savedTheme;
  document.documentElement.dataset.motion = localStorage.getItem('bato.motion') || 'on';

  const draft = localStorage.getItem('bato.draft');
  if(draft){ try { state.draft = JSON.parse(draft); } catch(_){} }

  loadAuth();
  loadTheme();
  try{ state.readTab = sessionStorage.getItem('bato.readTab') || 'magazine'; }catch(_){}
  const hashScreen = location.hash.replace('#', '');
  if(NAV.some(([k]) => k === hashScreen)) state.screen = hashScreen;

  const sessions = sessionCount();

  window.addEventListener('online',  () => { state.online = true;  render(); toast('Back online'); });
  window.addEventListener('offline', () => { state.online = false; render(); });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('message', (e) => {
      if(e.data?.type === 'PACK_CACHED'){
        state.packCached = e.data.cached;
        state.packFailed = e.data.failed;
        if(e.data.failed && e.data.firstFailure){
          console.warn('Offline pack incomplete:', e.data.firstFailure);
        }
        if(state.screen === 'read') render();
      }
    });
  }

  render();
  await resolveScan();
  // Anything fetched before the API answered was sample data; load the real thing now.
  if(state.liveApi){ state.vlogs.loaded = false; state.myPosts.loaded = false; }
  render();
  maybeShowInstall(sessions);
})();
</script>
