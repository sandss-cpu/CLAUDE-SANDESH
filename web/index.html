<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bato — Nepal Travel Magazine</title>
<meta name="theme-color" content="#5B3FA8">
<link rel="manifest" href="/manifest.json">
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   "Prayer Flag" design system — palette and rules taken directly
   from the feature specification, section 7.
   ============================================================ */
:root{
  --saffron:#F4A024; --dusk:#5B3FA8; --rhodo:#E8455F; --teal:#159A8C;
  --prayer:#2F6FD0; --terracotta:#C4562E; --ink:#1C1A2E; --paper:#FDFAF3;
  --green:#3E9B4F; --amber:#E5892E;

  --bg:var(--paper); --surface:#fff; --surface-2:#F6F1E6;
  --text:var(--ink); --text-dim:#5A5568; --line:#E4DED0;
  --brand:var(--dusk); --accent:var(--saffron);

  --r-sm:8px; --r:14px; --r-lg:22px;
  --tap:48px;              /* minimum target — accuracy on a moving bus */
  --pad:18px;
  --shadow:0 2px 10px rgba(28,26,46,.07), 0 12px 34px rgba(28,26,46,.06);
  --dur:.22s;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* Night buses are the norm on long routes: dark mode is essential, not optional.
   Deep purple-black base, warm dimmed accents, no pure white to dazzle a cabin. */
html[data-theme="night"]{
  --bg:#141024; --surface:#1E1834; --surface-2:#271F42;
  --text:#EDE7F7; --text-dim:#A79BC4; --line:#332A52;
  --saffron:#E8A33F; --rhodo:#DC6076; --teal:#3DAFA1;
  --prayer:#5B8FE0; --terracotta:#CE7550; --brand:#8B6FD4; --accent:#E8A33F;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
/* Harsh midday sun on a highway: maximum contrast, no mid-tones. */
html[data-theme="sun"]{
  --bg:#fff; --surface:#fff; --surface-2:#F0EDE4; --text:#000;
  --text-dim:#2A2A2A; --line:#000; --brand:#3A2270; --accent:#B96A00;
  --shadow:none;
}
/* ============================================================
   Batoma palettes, set by an admin for the whole platform.
   Each restates every token, so no colour survives from the last one.
   ============================================================ */
html[data-palette="rhododendron"]{
  --bg:#FDF1F3; --surface:#fff; --surface-2:#F7E2E6; --text:#2C1420; --text-dim:#6B4451; --line:#EBCDD4;
  --brand:#A82848; --accent:#E8455F; --prayer:#B4436B; --teal:#3E8E82;
}
html[data-palette="himalaya-dawn"]{
  --bg:#EEF3FA; --surface:#fff; --surface-2:#E1EAF6; --text:#12243B; --text-dim:#48607D; --line:#CDDAEA;
  --brand:#2F5D9E; --accent:#F0883F; --prayer:#2F6FD0; --teal:#2C8C9B;
}
html[data-palette="teahouse"]{
  --bg:#F6EDDF; --surface:#FFFCF7; --surface-2:#EFE1CC; --text:#3A2A18; --text-dim:#6B573F; --line:#DFCDB2;
  --brand:#8A5A2B; --accent:#D98E04; --prayer:#8A6A3B; --teal:#5E7A4A;
}
html[data-palette="forest-trail"]{
  --bg:#EFF5EF; --surface:#fff; --surface-2:#DFEADF; --text:#132318; --text-dim:#456049; --line:#C9DBCB;
  --brand:#2F6B3F; --accent:#6FAE3F; --prayer:#3C7E63; --teal:#2E8574;
}
html[data-palette="monsoon"]{
  --bg:#EDF1F1; --surface:#fff; --surface-2:#DEE7E7; --text:#14201F; --text-dim:#42585A; --line:#C6D5D6;
  --brand:#37626B; --accent:#7FA653; --prayer:#3F7488; --teal:#2F7F78;
}
html[data-palette="lakeside-sunset"]{
  --bg:#FDF0E6; --surface:#fff; --surface-2:#F7E2D1; --text:#2A1A14; --text-dim:#6A4A3A; --line:#EDD2BB;
  --brand:#B4532A; --accent:#E8934A; --prayer:#9C5A3C; --teal:#3E8B84;
}
html[data-palette="night-bus"]{
  --bg:#141024; --surface:#1E1834; --surface-2:#271F42; --text:#EDE7F7; --text-dim:#A79BC4; --line:#332A52;
  --brand:#8B6FD4; --accent:#E8A33F; --prayer:#5B8FE0; --teal:#3DAFA1;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}

/* ---------- Nepali backgrounds: CSS only, so they cost nothing to load ---------- */
body[data-background]{background-attachment:fixed;background-repeat:no-repeat;background-size:cover}
/* Lali gurans: soft blooms scattered behind the page */
body[data-background="rhododendron"]{
  background-image:
    radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--rhodo) 16%, transparent) 0 6px, transparent 7px),
    radial-gradient(circle at 15% 22%, color-mix(in srgb, var(--rhodo) 16%, transparent) 0 6px, transparent 7px),
    radial-gradient(circle at 9% 23%, color-mix(in srgb, var(--rhodo) 16%, transparent) 0 6px, transparent 7px),
    radial-gradient(circle at 84% 62%, color-mix(in srgb, var(--rhodo) 13%, transparent) 0 7px, transparent 8px),
    radial-gradient(circle at 88% 67%, color-mix(in srgb, var(--rhodo) 13%, transparent) 0 7px, transparent 8px),
    radial-gradient(circle at 80% 68%, color-mix(in srgb, var(--rhodo) 13%, transparent) 0 7px, transparent 8px);
  background-size:auto;background-attachment:fixed;
}
/* A faint line of bunting under the masthead */
body[data-background="prayer-flags"]{
  background-image:repeating-linear-gradient(135deg,
    color-mix(in srgb, var(--prayer) 10%, transparent) 0 26px,
    color-mix(in srgb, var(--paper) 0%, transparent) 26px 52px,
    color-mix(in srgb, var(--rhodo) 10%, transparent) 52px 78px,
    color-mix(in srgb, var(--green) 10%, transparent) 78px 104px,
    color-mix(in srgb, var(--saffron) 10%, transparent) 104px 130px);
  background-size:100% 120px;background-position:0 0;background-repeat:no-repeat;
}
/* A pale skyline along the foot of the page */
body[data-background="himalaya"]{
  background-image:
    linear-gradient(160deg, transparent 60%, color-mix(in srgb, var(--brand) 9%, transparent) 60.2% 72%, transparent 72.2%),
    linear-gradient(200deg, transparent 64%, color-mix(in srgb, var(--brand) 7%, transparent) 64.2% 78%, transparent 78.2%);
  background-size:100% 100%;background-position:bottom;
}
body[data-background="terraced-fields"]{
  background-image:repeating-linear-gradient(175deg,
    color-mix(in srgb, var(--green) 7%, transparent) 0 14px,
    transparent 14px 44px);
}
body[data-background="newar-lattice"]{
  background-image:
    repeating-linear-gradient(45deg, color-mix(in srgb, var(--terracotta) 7%, transparent) 0 2px, transparent 2px 18px),
    repeating-linear-gradient(-45deg, color-mix(in srgb, var(--terracotta) 7%, transparent) 0 2px, transparent 2px 18px);
  background-size:auto;
}
body[data-background="paper-grain"]{
  background-image:
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 3%, transparent) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--ink) 2%, transparent) 0 1px, transparent 1px 6px);
  background-size:auto;
}

html[data-motion="off"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);
  font-size:17px;line-height:1.6;           /* spec minimum for a vibrating vehicle */
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--prayer)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad)}

/* ---------- masthead: the route-aware signature ---------- */
/* Built from the palette's own colours, so an admin changing the theme changes the
   masthead with it rather than leaving a purple band above a pink page. */
.mast{
  background:linear-gradient(135deg,var(--brand) 0%,
    color-mix(in srgb, var(--brand) 72%, var(--accent)) 55%, var(--rhodo) 140%);
  color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 20px;position:relative;overflow:hidden;
}
html[data-theme="sun"] .mast{background:#3A2270}
/* Prayer-flag bunting: the five colours, used once, as the brand mark. */
.flags{display:flex;height:5px;width:100%}
.flags i{flex:1}
.mast-in{padding:0 var(--pad);max-width:560px;margin:0 auto;position:relative;z-index:1}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  opacity:.85;display:flex;align-items:center;gap:7px;margin-bottom:6px
}
.mast h1{font-size:27px;color:#fff;margin-bottom:3px}
.mast .sub{font-size:14px;opacity:.85}
.mast-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.seat{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  border-radius:var(--r-sm);padding:5px 9px;font-size:11px;font-weight:600;
  text-align:center;line-height:1.3;white-space:nowrap
}
.seat b{display:block;font-size:16px}

/* ---------- offline state: friendly, never an error ---------- */
.offline-chip{
  display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--green);
  border-radius:var(--r);padding:11px 13px;margin:14px 0;font-size:14px;box-shadow:var(--shadow)
}
.offline-chip.warn{border-left-color:var(--amber)}
.offline-chip .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.offline-chip.warn .dot{background:var(--amber)}

/* ---------- section-coded colour ---------- */
.tag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#fff
}
.c-trekking{background:var(--teal)} .c-heritage{background:var(--terracotta)}
.c-food{background:var(--saffron)} .c-festivals{background:var(--rhodo)}
.c-wildlife{background:var(--green)} .c-road{background:var(--prayer)}

/* ---------- cards ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec-head h2{font-size:21px}
.sec-head span{font-size:12px;color:var(--text-dim);font-weight:600}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);
  transition:transform var(--dur) ease;text-align:left;width:100%;display:block
}
.card:active{transform:scale(.985)}
.card-art{height:132px;position:relative;display:flex;align-items:flex-end;padding:12px}
.card-body{padding:14px 16px 16px}
.card h3{font-size:19px;margin-bottom:5px}
.card p{margin:0;font-size:14.5px;color:var(--text-dim)}
.meta{display:flex;gap:12px;align-items:center;margin-top:11px;font-size:12.5px;color:var(--text-dim);font-weight:600}
.meta .listen{color:var(--brand);display:flex;align-items:center;gap:4px}

.hero-card .card-art{height:190px}
.hero-card h3{font-size:24px}

.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px var(--pad) 6px;margin:0 calc(var(--pad) * -1);-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail .card{min-width:216px;max-width:216px;scroll-snap-align:start;margin:0}
.rail .card-art{height:110px}

/* ---------- skeleton in brand colours, never grey ---------- */
.skel{border-radius:var(--r);background:
  linear-gradient(100deg,var(--surface-2) 30%,rgba(244,160,36,.16) 50%,var(--surface-2) 70%);
  background-size:220% 100%;animation:sweep 1.3s infinite}
@keyframes sweep{to{background-position:-220% 0}}

/* ---------- reader ---------- */
.reader{padding-top:6px}
.reader h1{font-size:30px;margin:16px 0 8px}
.reader .standfirst{font-size:18px;color:var(--text-dim);margin-bottom:16px}
.article-body{font-size:17.5px}
.article-body p{margin:0 0 17px}
.article-body strong{color:var(--brand)}
.article-body em{color:var(--text-dim)}
.listen-bar{
  position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:8px 8px 8px 16px;box-shadow:var(--shadow);margin:14px 0 20px
}
.listen-bar .lbl{flex:1;font-size:13.5px;font-weight:600}
.listen-bar .lbl small{display:block;font-weight:400;color:var(--text-dim);font-size:12px}
.play{
  width:var(--tap);height:var(--tap);border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:17px;flex:none
}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:var(--accent);width:0}

/* ---------- forms & buttons ---------- */
.btn{
  min-height:var(--tap);border-radius:var(--r);padding:0 20px;font-weight:700;font-size:15.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%
}
.btn-primary{background:var(--accent);color:#231600}
html[data-theme="night"] .btn-primary{color:#241802}
.btn-brand{background:var(--brand);color:#fff}
.btn-ghost{border:1.5px solid var(--line);background:var(--surface)}
.btn-row{display:flex;gap:10px;margin:16px 0}
input,textarea,select{
  width:100%;min-height:var(--tap);background:var(--surface);color:var(--text);
  border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;font:inherit;font-size:16px
}
textarea{min-height:130px;resize:vertical;line-height:1.55}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--text-dim)}

/* ---------- template chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* ---------- photo picker ---------- */
.label-note{font-weight:500;margin-left:6px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;margin:0;
  background:var(--surface-2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-tag,.ph-cover{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;padding:3px 9px;
  border-radius:999px;color:#fff;border:0}
.ph-tag{background:var(--brand)}
.ph-cover{background:rgba(28,26,46,.74);min-height:28px;cursor:pointer}
.ph-remove{position:absolute;top:5px;right:5px;width:32px;height:32px;border-radius:50%;border:0;
  background:rgba(28,26,46,.74);color:#fff;font-size:19px;line-height:1;cursor:pointer}
.ph-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;
  border:1.5px dashed var(--line);color:var(--brand);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.ph-add span{font-size:26px;line-height:1}
.ph-busy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-size:12px;color:var(--text-dim)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap;border:0}

/* ---------- read tabs & traveller vlogs ---------- */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;margin:16px 0 4px}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:999px;font:inherit;font-weight:700;
  font-size:14px;color:var(--text-dim);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.vlog{padding:0;overflow:hidden}
.vlog-open{display:block;width:100%;text-align:left;color:inherit;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.vlog-cover{display:block;width:100%;height:200px;object-fit:cover;background:var(--surface-2)}
.vlog h3{font-size:19px;margin-bottom:4px}
.vlog-by{font-size:12.5px;color:var(--text-dim);font-weight:600}
.vlog .card-body p{margin-top:8px}
.vlog-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 16px 14px}
.vote-bar{display:flex;gap:8px}
.vote{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);font:inherit;font-size:14px;color:var(--text);cursor:pointer}
.vote b{font-variant-numeric:tabular-nums}
.vote.up[aria-pressed="true"]{background:#E4F3E7;border-color:var(--green);color:#1F6B30}
.vote.down[aria-pressed="true"]{background:#FCE9EC;border-color:var(--rhodo);color:#9C1C36}
html[data-theme="night"] .vote.up[aria-pressed="true"]{background:#16301C;color:#A9DDB4}
html[data-theme="night"] .vote.down[aria-pressed="true"]{background:#3A1420;color:#F4B4C1}
.vote:disabled{opacity:.65;cursor:default}
.vlog-photos{font-size:12.5px;color:var(--text-dim);font-weight:600}
.reader .vlog-foot{padding:18px 0 8px}
.reader .vlog-by{margin-bottom:6px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px 0 4px;padding-bottom:6px}
.gallery img{flex:none;width:86%;max-height:380px;object-fit:cover;border-radius:14px;scroll-snap-align:center;
  background:var(--surface-2)}
.gallery img:only-child{width:100%}
.empty-state{text-align:center;padding:36px 12px;color:var(--text-dim);display:flex;flex-direction:column;
  align-items:center;gap:12px}
.status-pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--surface-2);color:var(--text-dim)}
.status-pill.live{background:#E4F3E7;color:#1F6B30}
.status-pill.review{background:#FDF1DA;color:#8A5300}
.status-pill.rejected{background:#FCE9EC;color:#9C1C36}
.mine-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mine-row:last-child{border-bottom:0}
.mine-row strong{font-size:15px;display:block}
.mine-row small{color:var(--text-dim);font-size:12.5px}

/* ---------- sponsored slots, set like a newspaper classified ---------- */
.ad{margin:18px 0}
.ad-rule{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--font-display);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)}
.ad-rule::before,.ad-rule::after{content:"";flex:1;height:3px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ad-body{display:flex;gap:14px;align-items:stretch;width:100%;text-align:left;color:inherit;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;
  font:inherit;cursor:pointer}
.ad-body img{width:38%;min-height:124px;object-fit:cover;flex:none;background:var(--surface-2)}
.ad-copy{padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:3px;min-width:0}
.ad-from{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.07em}
.ad-title{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.2}
.ad-tagline{font-size:14px;color:var(--text-dim);line-height:1.4}
.ad-cta{margin-top:auto;padding-top:6px;font-size:13.5px;font-weight:700;color:var(--brand)}
.ad-banner{margin-top:14px}
.ad-banner .ad-body{flex-direction:column;gap:0}
.ad-banner .ad-body img{width:100%;height:160px;min-height:0}
.ad-banner .ad-copy{padding:12px 16px 14px}
.ad-tag{background:var(--ink);color:#fff}
html[data-theme="night"] .ad-tag{background:var(--surface-2);color:var(--text)}
.ad-hero{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin:12px 0;background:var(--surface-2)}

/* ---------- reporting ---------- */
.vlog-foot-right{display:flex;align-items:center;gap:6px}
.report-btn{min-height:44px;padding:0 12px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;
  color:var(--text-dim);background:none;border:1.5px solid transparent;cursor:pointer}
.report-btn:hover:not(:disabled),.report-btn:focus-visible{border-color:var(--line);color:var(--text)}
.report-btn:disabled{cursor:default;opacity:.75}
.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(20,16,36,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);color:var(--text);
  border-radius:22px 22px 0 0;padding:20px var(--pad) calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet h2{font-size:21px;margin-bottom:2px}
.sheet-sub{margin:0 0 12px;color:var(--text-dim);font-size:14px}
.reasons{border:0;margin:0;padding:0;display:grid;gap:6px}
.reason{display:flex;gap:10px;align-items:center;min-height:48px;margin:0;padding:0 12px;border:1.5px solid var(--line);
  border-radius:var(--r);font-size:15px;font-weight:600;color:var(--text);cursor:pointer}
.reason input{width:20px;height:20px;min-height:0;margin:0;flex:none;accent-color:var(--brand)}
.reason:has(input:checked){border-color:var(--brand);background:var(--surface-2)}
.report-error{background:#FCE9EC;color:#9C1C36;border-radius:var(--r);padding:10px 14px;font-size:14px;margin-top:12px}
html[data-theme="night"] .report-error{background:#3A1420;color:#F4B4C1}
.sheet-note{font-size:12.5px;color:var(--text-dim);margin:2px 0 0}
@media (min-width:640px){.sheet-back{align-items:center}.sheet{border-radius:22px}}
.chip{
  border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  padding:9px 14px;font-size:13.5px;font-weight:600;min-height:40px
}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ---------- business & coupon ---------- */
.biz{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;margin-bottom:10px;width:100%;text-align:left}
.biz .sq{width:54px;height:54px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:22px}
.biz h4{margin:0;font-size:16px;font-family:var(--font-display);font-weight:600}
.biz small{color:var(--text-dim);font-size:12.5px}
.badge-v{color:var(--green);font-weight:700;font-size:11.5px}
.coupon{
  background:linear-gradient(120deg,var(--saffron),var(--rhodo));color:#fff;border-radius:var(--r-lg);
  padding:18px;margin:16px 0;position:relative;overflow:hidden
}
.coupon .code{
  font-family:var(--font-display);font-size:31px;letter-spacing:.13em;font-weight:700;
  background:rgba(255,255,255,.19);border:1px dashed rgba(255,255,255,.55);
  border-radius:var(--r);padding:11px;text-align:center;margin-top:12px
}

/* ---------- itinerary ---------- */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px;margin-bottom:12px}
.day-h{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.day-n{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.stop{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.stop time{font-size:12px;font-weight:700;color:var(--accent);min-width:62px;padding-top:2px}

/* ---------- safety ---------- */
.sos{background:var(--rhodo);color:#fff;border-radius:var(--r-lg);padding:18px;text-align:center;margin-bottom:16px}
.sos .btn{background:#fff;color:var(--rhodo);margin-top:12px}
/* Hold-to-send: the fill is the three seconds, so the wait is visible rather than guessed. */
.sos-hold{position:relative;overflow:hidden;width:100%;touch-action:none;-webkit-user-select:none;user-select:none}
.sos-fill{position:absolute;inset:0 auto 0 0;width:0;background:color-mix(in srgb, var(--rhodo) 26%, transparent);transition:width .06s linear}
.sos-label{position:relative}
.sos-note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;font-size:14px}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.contact b{font-size:14.5px}
.contact small{color:var(--text-dim);display:block}
.ec-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ec-form input{flex:1;min-width:120px;padding:11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);color:var(--text);font:inherit}
.num{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.num a{font-family:var(--font-display);font-size:19px;font-weight:700;text-decoration:none;color:var(--brand)}

/* ---------- bottom navigation: one-thumb reach ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -3px 18px rgba(28,26,46,.09)
}
nav button{
  flex:1;min-height:var(--tap);padding:9px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--text-dim);
  letter-spacing:.02em
}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--brand)}
nav button[aria-current="page"] svg{stroke:var(--brand)}

/* ---------- install banner: second session onwards, never the first ---------- */
.install{
  position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;
  background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:15px;display:none;
  gap:13px;align-items:center;box-shadow:0 10px 34px rgba(0,0,0,.32);max-width:536px;margin:0 auto
}
.install.show{display:flex;animation:rise .3s ease}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.install .ico{width:44px;height:44px;border-radius:12px;background:var(--accent);
  display:grid;place-items:center;font-size:22px;flex:none}
.install p{margin:0;font-size:13.5px;line-height:1.4}
.install .stores{display:flex;gap:7px;margin-top:8px}
.install .stores a{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;
  font-size:11.5px;font-weight:700;color:#fff;text-decoration:none}
.install .x{font-size:22px;color:#fff;opacity:.5;padding:8px;min-height:var(--tap)}

.settings{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}
.hidden{display:none!important}
.empty{text-align:center;padding:44px 20px;color:var(--text-dim)}
.empty .big{font-size:42px;margin-bottom:10px}
.empty h3{font-size:19px;margin-bottom:6px;color:var(--text)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;
  font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity var(--dur)
}
html[data-theme="night"] .toast{background:var(--surface-2);border:1px solid var(--line)}
.toast.show{opacity:1}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <div class="mast-row">
      <div>
        <div class="eyebrow"><span id="eyebrow">Nepal's travel magazine</span></div>
        <h1 id="mastTitle">Batoma</h1>
        <div class="sub" id="mastSub">Stories, road guides and the buses that carry them</div>
      </div>
      <div class="seat" id="seatChip">Seat<b>—</b></div>
    </div>
  </div>
  <div class="flags" style="margin-top:16px" aria-hidden="true">
    <i style="background:#2F6FD0"></i><i style="background:#FDFAF3"></i>
    <i style="background:#E8455F"></i><i style="background:#3E9B4F"></i>
    <i style="background:#F4A024"></i>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav id="nav" aria-label="Main"></nav>

<div class="install" id="installBar" role="dialog" aria-label="Get the app">
  <div class="ico">📲</div>
  <div style="flex:1">
    <p><strong>Keep Batoma for the whole journey.</strong> The app holds offline maps that a browser can't.</p>
    <div class="stores">
      <a href="#" id="playLink">Google Play</a>
      <a href="#" id="iosLink">App Store</a>
    </div>
  </div>
  <button class="x" id="dismissInstall" aria-label="Not now">×</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/actions.js"></script>
<script src="/js/reader.js"></script>
</body>
</html>
