<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rate your bus — Batoma</title>
<meta name="description" content="Find a bus by its registration number, see what passengers say, and leave your own review.">
<meta name="theme-color" content="#5B3FA8">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/fonts.css">
<script src="/config.js"></script>
<style>
/* "Prayer Flag" tokens, shared with index.html. Big targets and high contrast: this page is opened from a seat on a moving bus. */
:root{
  --saffron:#F4A024; --dusk:#5B3FA8; --rhodo:#E8455F; --ink:#1C1A2E; --paper:#FDFAF3; --green:#3E9B4F; --amber:#E5892E;
  --bg:var(--paper); --surface:#fff; --surface-2:#F6F1E6; --text:var(--ink); --text-dim:#5A5568; --line:#E4DED0;
  --brand:var(--dusk); --accent:var(--saffron); --star:#E59A12;
  --r:14px; --r-lg:20px; --tap:48px; --pad:18px;
  --shadow:0 2px 10px rgba(28,26,46,.07), 0 12px 34px rgba(28,26,46,.06);
  --font-display:'Fraunces',Georgia,serif; --font-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[data-theme="night"]{
  --bg:#141024; --surface:#1E1834; --surface-2:#271F42; --text:#EDE7F7; --text-dim:#A79BC4; --line:#332A52;
  --brand:#8B6FD4; --accent:#E8A33F; --star:#E8A33F; --shadow:0 2px 10px rgba(0,0,0,.4);
}
html[data-theme="sun"]{
  --bg:#fff; --surface:#fff; --surface-2:#F0EDE4; --text:#000; --text-dim:#2A2A2A; --line:#000;
  --brand:#3A2270; --accent:#B96A00; --star:#8A5300; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6;
  padding-bottom:calc(32px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;margin:0}
a{color:var(--brand)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.top{background:linear-gradient(135deg,var(--dusk) 0%,#7A4FC4 60%,var(--rhodo) 150%);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 0 0}
html[data-theme="sun"] .top{background:#3A2270}
.top-in{max-width:680px;margin:0 auto;padding:0 var(--pad) 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;color:#fff;text-decoration:none}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:8px 10px;border-radius:999px;opacity:.9}
.top nav a:hover{background:rgba(255,255,255,.14);opacity:1}
.flags{display:flex;height:5px}.flags i{flex:1}

.wrap{max-width:680px;margin:0 auto;padding:0 var(--pad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:var(--pad);margin-top:16px}
.btn{min-height:var(--tap);border-radius:var(--r);padding:0 20px;font-weight:700;font-size:15.5px;border:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--accent);color:#231600}
.btn:disabled{opacity:.55;cursor:default}
.btn-brand{background:var(--brand);color:#fff}
.btn-ghost{background:var(--surface);color:var(--text);border:1.5px solid var(--line)}
.btn-block{width:100%}
.link{background:none;border:none;color:var(--brand);font-weight:600;cursor:pointer;padding:8px 0;font-size:14.5px}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--text-dim);font-size:14.5px;text-decoration:none;
  background:none;border:none;cursor:pointer;padding:8px 0;min-height:44px}
input,textarea,select{width:100%;min-height:var(--tap);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);
  padding:11px 14px;font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label{display:block;font-size:13.5px;font-weight:700;margin:16px 0 6px;color:var(--text-dim)}
.hint{font-size:13px;color:var(--text-dim);margin-top:5px}
.error{background:#FCE9EC;color:#9C1C36;border-radius:var(--r);padding:11px 14px;font-size:14.5px;margin-top:14px}
.ok{background:#E4F3E7;color:#1F6B30;border-radius:var(--r);padding:11px 14px;font-size:14.5px;margin-top:14px}
html[data-theme="night"] .error{background:#3A1420;color:#F4B4C1}
html[data-theme="night"] .ok{background:#16301C;color:#A9DDB4}

.hero{padding:26px 0 4px}
.hero h1{font-size:30px}
.hero p{margin:6px 0 0;color:var(--text-dim)}
.search{display:flex;gap:8px;margin-top:16px}
.search input{flex:1}
.results{margin-top:14px;display:grid;gap:10px}
.result{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;cursor:pointer;min-height:72px}
.result:hover{border-color:var(--brand)}
.thumb{width:62px;height:62px;border-radius:12px;background:var(--surface-2);flex:none;object-fit:cover;display:grid;place-items:center;font-size:26px}
.result h3{font-size:17px}
.result small{display:block;color:var(--text-dim);font-size:13px;line-height:1.4}
.plate{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.04em;font-size:13px;
  background:#FFF6D8;color:#3B2A00;border:1.5px solid #2B2B2B;border-radius:6px;padding:1px 8px}
html[data-theme="night"] .plate{background:#2C2410;color:#F6E6B6;border-color:#8C7A4A}
.empty{text-align:center;color:var(--text-dim);padding:26px 8px}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.bus-photo{width:calc(100% + 2 * var(--pad));margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 14px;height:190px;object-fit:cover;
  border-radius:var(--r-lg) var(--r-lg) 0 0;display:block;background:var(--surface-2)}
.bus-head h1{font-size:27px;margin-top:8px}
.company{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;color:var(--text-dim);font-weight:600}
.verified{color:var(--green);font-size:13px;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--text-dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.status-note{margin-top:12px;font-size:14px;font-weight:600;color:var(--amber)}

.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.big{font-family:var(--font-display);font-size:48px;font-weight:700;line-height:1}
.stars{color:var(--star);letter-spacing:1px;font-size:18px;white-space:nowrap}
.dist{display:grid;gap:5px}
.dist-row{display:grid;grid-template-columns:28px 1fr 30px;gap:8px;align-items:center;font-size:13px;color:var(--text-dim)}
.bar{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--star);border-radius:999px}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:16px}
.part{background:var(--surface-2);border-radius:12px;padding:9px 12px;font-size:13.5px}
.part b{display:block;font-size:18px;font-family:var(--font-display)}

.rate{display:flex;gap:4px;flex-wrap:wrap}
.star-btn{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:28px;
  line-height:1;cursor:pointer;color:var(--line)}
.star-btn[aria-checked="true"],.star-btn.on{color:var(--star);border-color:var(--star)}
.rate-label{font-size:14px;font-weight:700;color:var(--text-dim);margin-top:6px;min-height:22px}
.sub-rate{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sub-rate:last-child{border-bottom:none}
.sub-rate span{font-weight:600;font-size:15px}
.sub-rate .star-btn{width:42px;height:42px;font-size:22px;border-radius:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border-radius:999px;padding:5px 12px;
  background:#E4F3E7;color:#1F6B30}
html[data-theme="night"] .badge{background:#16301C;color:#A9DDB4}
.gate{display:grid;gap:10px}
.gate p{margin:0;color:var(--text-dim);font-size:15px}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 4px}
.sec h2{font-size:21px}
.sec span{font-size:13px;color:var(--text-dim)}
.review{border-bottom:1px solid var(--line);padding:14px 0}
.review:last-child{border-bottom:none}
.rv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--text-dim)}
.rv-who{font-weight:700}
.rv-who.v{color:var(--green)}
.review p{margin:6px 0 0;overflow-wrap:anywhere}
.rv-parts{font-size:13px;color:var(--text-dim);margin-top:4px}
.reply{background:var(--surface-2);border-left:4px solid var(--brand);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.reply b{display:block;font-size:13px}
.reply p{margin:2px 0 0}
.rv-foot{display:flex;justify-content:flex-end}

.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(20,16,36,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:20px var(--pad) calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.sheet-back{align-items:center}.sheet{border-radius:22px}}
.reason{display:flex;gap:10px;align-items:center;min-height:48px;margin:6px 0 0;padding:0 12px;border:1.5px solid var(--line);
  border-radius:var(--r);font-size:15px;font-weight:600;color:var(--text);cursor:pointer}
.reason input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--brand)}
.row-btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.row-btns .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.owner-cta{margin-top:30px;text-align:center;font-size:14px;color:var(--text-dim)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html">Batoma</a>
    <nav aria-label="Batoma">
      <a href="bus.html">Find a bus</a>
      <a href="index.html">Magazine</a>
      <a href="owner.html">For bus owners</a>
    </nav>
  </div>
  <div class="flags" aria-hidden="true">
    <i style="background:#2F6FD0"></i><i style="background:#FDFAF3"></i><i style="background:#E8455F"></i>
    <i style="background:#3E9B4F"></i><i style="background:#F4A024"></i>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/actions.js"></script>
<script src="/js/bus.js"></script>
</body>
</html>
