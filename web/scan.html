<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<title>Scan a bus · Batoma</title>
<meta name="theme-color" content="#5B3FA8">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/fonts.css">
<style>
:root{
  --brand:#5B3FA8; --accent:#F4A024; --ink:#1C1A2E; --paper:#FDFAF3; --surface:#fff; --line:#E4DED0;
  --text:var(--ink); --text-dim:#5A5568; --bad:#B42318; --r:14px; --tap:48px;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#141024; --surface:#1E1834; --line:#332A52; --text:#EDE7F7; --text-dim:#A79BC4; --bad:#F4A2A2; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;line-height:1.55}
header{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px}
header a{color:#fff;text-decoration:none;font-weight:700;font-size:15px;display:inline-flex;min-height:var(--tap);align-items:center}
header h1{margin:2px 0 0;font-size:26px}
main{max-width:560px;margin:0 auto;padding:18px}
.viewer{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;display:grid;place-items:center}
.viewer video{width:100%;height:100%;object-fit:cover}
.viewer .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:18px;pointer-events:none}
.viewer .idle{color:#fff;text-align:center;padding:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);padding:0 20px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer;width:100%}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.status{min-height:28px;margin:12px 0;color:var(--text-dim)}
.status.bad{color:var(--bad)}
form{margin-top:18px;display:grid;gap:8px}
label{font-weight:600}
input{min-height:var(--tap);border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;text-transform:uppercase;
  letter-spacing:.08em;background:var(--surface);color:var(--text)}
.hint{font-size:14px;color:var(--text-dim)}
</style>
</head>
<body>
<header>
  <a href="/">← Back to Batoma</a>
  <h1>Scan a bus</h1>
</header>
<main>
  <div class="viewer" id="viewer">
    <div class="idle" id="idle">
      <p>Point your camera at the Batoma QR code inside the bus.</p>
      <button class="btn btn-primary" data-action="startCamera">Start camera</button>
    </div>
    <video id="video" playsinline muted hidden></video>
    <div class="frame" id="frame" hidden></div>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <form data-submit="openCode" novalidate>
    <label for="code">Or type the code printed under the QR</label>
    <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16"
           placeholder="e.g. 6KNJ5RAS2T">
    <button class="btn" type="submit">Open</button>
  </form>
  <p class="hint">The camera is only used on this page, only while it is open, and nothing is recorded.</p>
</main>
<script src="/js/actions.js"></script>
<script src="/js/scan.js"></script>
</body>
</html>
