<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<title>Creators — Batoma</title>
<meta name="description" content="Travellers who tell the whole story: the road, the days, what it cost and what to carry.">
<meta name="theme-color" content="#5B3FA8">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/fonts.css">
<script src="config.js"></script>
<style>
:root{
  --saffron:#F4A024; --dusk:#5B3FA8; --rhodo:#E8455F; --ink:#1C1A2E; --paper:#FDFAF3; --green:#2F8A43; --amber:#B86A00;
  --bg:var(--paper); --surface:#fff; --surface-2:#F6F1E6; --text:var(--ink); --text-dim:#5A5568; --line:#E4DED0;
  --brand:var(--dusk); --accent:var(--saffron);
  --r:14px; --r-lg:20px; --tap:48px; --pad:18px;
  --shadow:0 2px 10px rgba(28,26,46,.07), 0 12px 34px rgba(28,26,46,.06);
  --font-display:'Fraunces',Georgia,serif; --font-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[data-theme="night"]{
  --bg:#141024; --surface:#1E1834; --surface-2:#271F42; --text:#EDE7F7; --text-dim:#A79BC4; --line:#332A52;
  --brand:#8B6FD4; --accent:#E8A33F; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--text-dim)}
.small{font-size:13.5px}

.top{background:linear-gradient(135deg,var(--dusk) 0%,#7A4FC4 60%,var(--rhodo) 150%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 0}
.top-in{max-width:760px;margin:0 auto;padding:0 var(--pad) 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;color:#fff;text-decoration:none}
.top nav{display:flex;gap:2px;flex-wrap:wrap}
.top nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:8px 10px;border-radius:999px;opacity:.9}
.top nav a:hover{background:rgba(255,255,255,.14)}
.flags{display:flex;height:5px}.flags i{flex:1}

.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:var(--pad);margin-top:16px}
.btn{min-height:var(--tap);border-radius:var(--r);padding:0 18px;font-weight:700;font-size:15px;border:1.5px solid transparent;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--accent);color:#231600}
.btn:disabled{opacity:.55;cursor:default}
.btn-brand{background:var(--brand);color:#fff}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-danger{background:var(--rhodo);color:#fff}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn-block{width:100%}
.link{background:none;border:none;color:var(--brand);font-weight:600;cursor:pointer;padding:6px 0;font-size:14.5px}
.back{display:inline-flex;gap:6px;align-items:center;margin-top:14px;color:var(--text-dim);font-size:14.5px;background:none;border:none;cursor:pointer;padding:8px 0}
input,textarea,select{width:100%;min-height:var(--tap);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 13px;font-size:16px}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:13.5px;font-weight:700;margin:14px 0 5px;color:var(--text-dim)}
.hint{font-size:13px;color:var(--text-dim);margin-top:5px}
.error{background:#FCE9EC;color:#9C1C36;border-radius:var(--r);padding:11px 14px;font-size:14.5px;margin-top:14px}
.ok{background:#E4F3E7;color:#1F6B30;border-radius:var(--r);padding:11px 14px;font-size:14.5px;margin-top:14px}
html[data-theme="night"] .error{background:#3A1420;color:#F4B4C1}
html[data-theme="night"] .ok{background:#16301C;color:#A9DDB4}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--text-dim)}
.pill.good{background:#E4F3E7;color:#1F6B30}.pill.warn{background:#FDF1DA;color:#8A5300}.pill.bad{background:#FCE9EC;color:#9C1C36}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.empty{text-align:center;color:var(--text-dim);padding:30px 10px}

/* profile */
.cover{height:170px;border-radius:var(--r-lg);background:linear-gradient(135deg,#5B3FA8,#E8455F);object-fit:cover;width:100%;display:block;margin-top:16px}
.who{display:flex;gap:14px;align-items:flex-end;margin-top:-42px;padding:0 6px}
.avatar{width:96px;height:96px;border-radius:50%;border:4px solid var(--surface);object-fit:cover;background:var(--surface-2);flex:none;
  display:grid;place-items:center;font-size:34px;font-family:var(--font-display)}
.who h1{font-size:26px}
.handle{color:var(--text-dim);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:20px}
.stat span{font-size:12px;color:var(--text-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);
  text-align:left;padding:0;cursor:pointer;color:inherit;font:inherit;text-decoration:none;display:block}
.tile:hover{border-color:var(--brand)}
.tile img{width:100%;height:140px;object-fit:cover;background:var(--surface-2);display:block}
.tile .body{padding:12px 14px}
.tile h3{font-size:17px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 2px;gap:10px;flex-wrap:wrap}
.sec h2{font-size:21px}
.cost{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.cost div{background:var(--surface-2);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--text-dim)}
.cost b{display:block;font-family:var(--font-display);font-size:18px;color:var(--text)}
.entry{border-left:3px solid var(--line);padding:0 0 18px 16px;position:relative;margin-left:8px}
.entry::before{content:"";position:absolute;left:-8px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--brand)}
.entry h3{font-size:18px}
.entry .day{font-size:12.5px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.gallery{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.gallery img{height:150px;border-radius:12px;flex:none;object-fit:cover}
.ad{margin:18px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ad-rule{display:flex;align-items:center;gap:10px;padding:6px 12px 0;font-family:var(--font-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)}
.ad-body{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:none}
.ad-body img{width:38%;max-width:200px;object-fit:cover;background:var(--surface-2)}
.ad-copy{padding:10px 12px 12px 0}
.ad-copy .from{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.07em}
.ad-copy h3{font-size:17px;margin:2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.panel-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.journey-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.journey-row:last-child{border-bottom:none}
.post-pick{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.post-pick:last-child{border-bottom:none}
.post-pick img{width:56px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface-2);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.modal-back{position:fixed;inset:0;background:rgba(20,16,36,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:620px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:600px){.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html">Batoma</a>
    <nav aria-label="Batoma">
      <a href="creator.html">Creators</a>
      <a href="index.html">Magazine</a>
      <a href="bus.html">Rate a bus</a>
      <a href="creator.html?panel=1">Creator panel</a>
    </nav>
  </div>
  <div class="flags" aria-hidden="true">
    <i style="background:#2F6FD0"></i><i style="background:#FDFAF3"></i><i style="background:#E8455F"></i>
    <i style="background:#3E9B4F"></i><i style="background:#F4A024"></i>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/actions.js"></script>
<script src="/js/creator.js"></script>
</body>
</html>
