<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batoma — Control Panel</title>
<meta name="theme-color" content="#5B3FA8">
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --saffron:#F4A024; --dusk:#5B3FA8; --rhodo:#E8455F; --teal:#159A8C;
  --terracotta:#C4562E; --ink:#1C1A2E; --paper:#FDFAF3; --green:#3E9B4F; --amber:#E5892E;
  --bg:#F2EEE3; --surface:#fff; --surface-2:#F6F1E6;
  --text:var(--ink); --text-dim:#5A5568; --line:#E4DED0;
  --brand:var(--dusk); --accent:var(--saffron);
  --r-sm:8px; --r:12px; --shadow:0 2px 10px rgba(28,26,46,.07), 0 12px 34px rgba(28,26,46,.06);
  --font-display:'Fraunces',Georgia,serif; --font-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* ---------- colour palettes ----------
   Each one restates the whole set of tokens, so a palette can never leave a
   colour from the previous one behind. Picked in the sidebar, kept per browser. */
html[data-palette="dawn"]{
  --bg:#EDF2F8; --surface:#fff; --surface-2:#E3EBF5; --text:#12243B; --text-dim:#4C6076; --line:#CFDAE8;
  --brand:#2F5D9E; --accent:#F0883F; --ink:#12243B;
}
html[data-palette="teahouse"]{
  --bg:#F4EADC; --surface:#FFFCF7; --surface-2:#EFE2CE; --text:#3A2A18; --text-dim:#6B573F; --line:#DFCDB2;
  --brand:#8A5A2B; --accent:#D98E04; --ink:#3A2A18;
}
html[data-palette="rhododendron"]{
  --bg:#FAEFF1; --surface:#fff; --surface-2:#F3E0E4; --text:#2C1420; --text-dim:#6B4451; --line:#E7CBD2;
  --brand:#A82848; --accent:#E8455F; --ink:#2C1420;
}
html[data-palette="forest"]{
  --bg:#EDF3ED; --surface:#fff; --surface-2:#DFEADF; --text:#132318; --text-dim:#456049; --line:#C9DBCB;
  --brand:#2F6B3F; --accent:#6FAE3F; --ink:#132318;
}
html[data-palette="nightbus"]{
  --bg:#141024; --surface:#1E1834; --surface-2:#271F42; --text:#EDE7F7; --text-dim:#A79BC4; --line:#332A52;
  --brand:#8B6FD4; --accent:#E8A33F; --ink:#0D0A18;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
html[data-palette="nightbus"] .pill.PUBLISHED,html[data-palette="nightbus"] .pill.APPROVED,html[data-palette="nightbus"] .pill.ACTIVE{background:#16301C;color:#A9DDB4}
html[data-palette="nightbus"] .pill.IN_REVIEW,html[data-palette="nightbus"] .pill.PENDING,html[data-palette="nightbus"] .pill.OPEN,html[data-palette="nightbus"] .pill.PAUSED{background:#35270D;color:#F1C77A}
html[data-palette="nightbus"] .pill.REJECTED,html[data-palette="nightbus"] .pill.REPORT{background:#3A1420;color:#F4B4C1}
html[data-palette="nightbus"] .error{background:#3A1420;color:#F4B4C1}
html[data-palette="nightbus"] aside{background:#0D0A18}
html[data-palette="slate"]{
  --bg:#EEF0F3; --surface:#fff; --surface-2:#E2E6EB; --text:#14181D; --text-dim:#4A535E; --line:#CBD2DA;
  --brand:#3C4A5A; --accent:#C97B2C; --ink:#14181D;
}
.palette-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.palette-card{border:2px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative}
.palette-card[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent)}
.palette-card[aria-pressed="true"]::after{content:"✓ In use";position:absolute;top:8px;right:10px;font-size:11px;font-weight:700;color:var(--brand)}
.palette-card:disabled{opacity:.6;cursor:default}

/* A small picture of the traveller app in the chosen palette, so the effect is visible here. */
.theme-preview{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r);padding:14px;margin-top:12px}
.tp-phone{width:168px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--p-bg);flex:none}
.tp-mast{background:linear-gradient(135deg,var(--p-brand) 0%,color-mix(in srgb,var(--p-brand) 72%,var(--p-accent)) 100%);color:#fff;padding:10px 12px}
.tp-mast span{font-size:9px;letter-spacing:.14em;opacity:.85;display:block}
.tp-mast b{font-family:var(--font-display);font-size:15px;line-height:1.15;display:block;margin-top:2px}
.tp-body{padding:10px;display:grid;gap:8px}
.tp-card{background:#fff;border-radius:8px;padding:8px;display:grid;gap:5px}
.tp-card i{display:block;height:22px;border-radius:5px;background:var(--p-accent);opacity:.75}
.tp-card span{display:block;height:6px;border-radius:3px;background:var(--p-brand);opacity:.28}
.tp-card span.short{width:55%}
.tp-phone[data-bg="rhododendron"] .tp-body{background:
  radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--p-accent) 26%, transparent) 0 7px, transparent 8px),
  radial-gradient(circle at 78% 70%, color-mix(in srgb, var(--p-accent) 22%, transparent) 0 8px, transparent 9px)}
.tp-phone[data-bg="prayer-flags"] .tp-body{background:repeating-linear-gradient(135deg,
  color-mix(in srgb, var(--p-brand) 16%, transparent) 0 10px, transparent 10px 20px,
  color-mix(in srgb, var(--p-accent) 16%, transparent) 20px 30px, transparent 30px 40px)}
.tp-phone[data-bg="himalaya"] .tp-body{background:linear-gradient(160deg, transparent 55%, color-mix(in srgb, var(--p-brand) 16%, transparent) 55.2% 72%, transparent 72.2%)}
.tp-phone[data-bg="terraced-fields"] .tp-body{background:repeating-linear-gradient(175deg, color-mix(in srgb, var(--p-brand) 12%, transparent) 0 5px, transparent 5px 16px)}
.tp-phone[data-bg="newar-lattice"] .tp-body{background:
  repeating-linear-gradient(45deg, color-mix(in srgb, var(--p-brand) 12%, transparent) 0 2px, transparent 2px 12px),
  repeating-linear-gradient(-45deg, color-mix(in srgb, var(--p-brand) 12%, transparent) 0 2px, transparent 2px 12px)}
.tp-phone[data-bg="paper-grain"] .tp-body{background:repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 4px)}
.palette-card strong{display:block;font-size:14px;margin-bottom:6px}
.swatches{display:flex;gap:4px}
.swatches i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.12)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font-size:14.5px;
}
textarea{min-height:220px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin:12px 0 5px}
.btn{
  display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--r-sm);
  padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--text);
}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);color:#231600}
.btn-brand{background:var(--brand);color:#fff}
.btn-danger{background:var(--rhodo);color:#fff}
.btn-ghost{background:transparent;color:var(--text-dim)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.error{background:#FCE9EC;color:#9C1C36;border-radius:var(--r-sm);padding:9px 12px;font-size:13.5px;margin-top:10px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--text-dim)}
.pill.PUBLISHED{background:#E4F3E7;color:var(--green)}
.pill.DRAFT{background:var(--surface-2)}
.pill.IN_REVIEW{background:#FDF1DA;color:var(--amber)}
.pill.ARCHIVED{background:#F0EDE4;color:var(--text-dim)}
.pill.PENDING{background:#FDF1DA;color:var(--amber)}
.pill.APPROVED{background:#E4F3E7;color:var(--green)}
.pill.REJECTED{background:#FCE9EC;color:var(--rhodo)}
.pill.OPEN{background:#FDF1DA;color:var(--amber)}

/* ---------- login ---------- */
#login-view{max-width:380px;margin:80px auto;padding:0 20px}
#login-view h1{font-size:26px;margin-bottom:4px}
#login-view p.sub{color:var(--text-dim);margin:0 0 20px}
#login-view .btn{width:100%;justify-content:center;min-height:44px;margin-top:14px}
.login-tabs{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;margin-bottom:6px}
.login-tabs button{flex:1;min-height:38px;border:none;background:none;border-radius:999px;font-weight:700;
  font-size:14px;color:var(--text-dim);cursor:pointer}
.login-tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.devcode,.secret{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700;color:var(--brand);word-break:break-all}
.back{display:block;margin-bottom:16px;color:var(--text-dim);font-size:13.5px;text-decoration:none}

/* ---------- route programming ---------- */
.prog-filters select{min-width:200px}
.prog-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
@media (max-width:1100px){.prog-grid{grid-template-columns:1fr}}
.prog-list h3,.prog-side h3{font-size:17px;margin:0 0 12px}
.prog-add{margin-bottom:14px}
.prog-results{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prog-results li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.prog-results li:first-child{border-top:none}
.prog-rows{list-style:none;margin:0;padding:0}
.prog-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line);background:var(--surface)}
.prog-row:first-child{border-top:none}
.prog-row.lead{background:var(--surface-2);border-radius:10px}
.prog-row.dragging{opacity:.45}
.prog-row .grip{width:18px;color:var(--text-dim);cursor:grab;font-size:18px;flex:none}
.prog-row[draggable="false"] .grip,.prog-row:not([draggable]) .grip{cursor:default}
.prog-what{flex:1;min-width:0}
.prog-row{flex-wrap:wrap}
.prog-row .row-actions{flex-wrap:wrap}
/* On a phone the title gets the row; the buttons wrap underneath it. */
@media (max-width:700px){
  .prog-what{flex-basis:calc(100% - 28px)}
  .prog-row .row-actions{width:100%;padding-left:28px}
  .prog-filters select{min-width:0;width:100%}
}
.prog-what strong{display:block}
.prog-when{color:var(--brand);font-weight:600}
.pill.lead-pill{background:var(--accent);color:#1C1A2E}
.prog-at{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.prog-at label{width:100%;margin:0}
.prog-preview{list-style:none;margin:10px 0 0;padding:0}
.prog-preview li{padding:8px 0;border-top:1px solid var(--line)}
.prog-preview li:first-child{border-top:none}
.prog-preview li.prog-lead strong{font-size:18px}
.prog-preview .pill{margin-right:6px}
.pill.level-VEHICLE{background:#F3E8FF;color:#5B3FA8}
.pill.level-OPERATOR{background:#E3F1FA;color:#1F5E8C}
.pill.level-ROUTE_DIRECTION{background:#E4F3E7;color:#2D7A3E}
.pill.level-ROUTE_BOTH{background:#EEF6EF;color:#3E6B47}
.notice-preview{border-left:4px solid var(--amber);background:var(--surface-2);padding:8px 12px;border-radius:8px;margin:8px 0}
.notice-preview.sev-DANGER,.prog-notices li.sev-DANGER{border-left-color:#C62E45}
.notice-preview.sev-INFO,.prog-notices li.sev-INFO{border-left-color:var(--brand)}
.prog-notices,.prog-history{list-style:none;margin:10px 0 0;padding:0}
.prog-notices li{border-left:4px solid var(--amber);padding:8px 12px;margin-bottom:10px;background:var(--surface-2);border-radius:8px}
.prog-history li{padding:8px 0;border-top:1px solid var(--line)}
.prog-history li:first-child{border-top:none}

/* ---------- shell ---------- */
#shell{display:none;min-height:100vh}
#shell.on{display:flex}
aside{width:210px;flex:none;background:var(--ink);color:#fff;padding:20px 14px;min-height:100vh}
/* Phones and small tablets: the sidebar becomes a scrollable top bar. */
@media (max-width:800px){
  #shell.on{flex-direction:column}
  aside{width:auto;min-height:0;padding:12px 14px;position:sticky;top:0;z-index:5}
  aside h1{font-size:16px}
  aside .who{margin-bottom:8px}
  aside nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
  aside nav button{white-space:nowrap;width:auto;margin:0}
  aside .signout{margin-top:6px}
  main{padding:18px 16px}
  .two-col{grid-template-columns:1fr}
}
aside h1{color:#fff;font-size:18px;margin-bottom:2px}
aside .who{font-size:12px;color:#B7AEDC;margin-bottom:18px}
aside nav button{
  display:block;width:100%;text-align:left;background:none;border:none;color:#D8D2EE;
  padding:10px 12px;border-radius:var(--r-sm);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:2px
}
aside nav button.active{background:rgba(255,255,255,.14);color:#fff}
aside .signout{margin-top:22px}
/* min-width:0 lets this flex child shrink, so wide tables scroll inside .table-wrap
   instead of stretching the page and pushing the action buttons off-screen. */
main{flex:1;min-width:0;padding:26px 32px;max-width:1100px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
th{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim)}
tr:last-child td{border-bottom:none}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filters input,.filters select{width:auto;min-width:160px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-family:var(--font-display)}
.stat span{font-size:12px;color:var(--text-dim)}
.empty{color:var(--text-dim);font-size:13.5px;padding:16px 0}
.modal-back{position:fixed;inset:0;background:rgba(28,26,46,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:40px 16px;overflow-y:auto;z-index:10}
.modal{background:var(--surface);border-radius:var(--r);padding:24px;max-width:640px;width:100%;box-shadow:var(--shadow)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.checks{display:flex;gap:18px;margin-top:14px}
.checks label{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);font-size:13.5px}
.checks input{width:auto}
.cover-field{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cover-preview{width:168px;height:100px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;
  flex:none;font-size:12px;color:var(--text-dim)}
.cover-preview img{width:100%;height:100%;object-fit:cover}
.hint{font-size:12px;color:var(--text-dim);margin-top:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap;border:0}

/* ---------- ads ---------- */
.modal-wide{max-width:980px}
.ad-form-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.ad-preview-col{position:sticky;top:0}
@media (max-width:860px){.ad-form-grid{grid-template-columns:1fr}.ad-preview-col{position:static;order:-1}}
.inline-fields{display:flex;gap:8px}
.inline-fields input{width:88px;flex:none}
.link-choice{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 14px 10px;margin:16px 0 0}
.link-choice legend{font-size:12.5px;font-weight:700;color:var(--text-dim);padding:0 6px}
.link-choice label{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--text);font-weight:600;font-size:13.5px}
.link-choice input{width:auto}
.ad-cell{display:flex;gap:10px;align-items:center}
.ad-cell img{width:64px;height:42px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2)}
.table-wrap{overflow-x:auto;border-radius:var(--r);box-shadow:var(--shadow)}
/* Scroll sideways on narrow screens rather than squeezing every column into a word-per-line stack. */
.table-wrap table{box-shadow:none;min-width:880px}
.table-wrap td small{white-space:nowrap}
/* Tables placed straight into the page scroll inside themselves on narrow screens
   instead of stretching the page (Articles, Users, Overview). */
#main > table{display:block;max-width:100%;overflow-x:auto}
.nowrap{white-space:nowrap}
.pill.ACTIVE{background:#E4F3E7;color:var(--green)}
.pill.SCHEDULED{background:#E6EEFB;color:#2F6FD0}
.pill.PAUSED{background:#FDF1DA;color:#8A5300}
.pill.EXPIRED{background:#F0EDE4;color:var(--text-dim)}
.adp-rule{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--font-display);font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)}
.adp-rule::before,.adp-rule::after{content:"";flex:1;height:3px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.adp-body{display:flex;gap:12px;background:#FDFAF3;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.adp-body img,.adp-noimg{width:38%;min-height:112px;object-fit:cover;flex:none;background:var(--surface-2)}
.adp-noimg{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim)}
.adp-copy{padding:10px 12px 10px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.adp-from{font-size:10.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.07em}
.adp-copy h3{font-size:16px;line-height:1.2}
.adp-copy p{margin:0;font-size:13px;color:var(--text-dim)}
.adp-cta{margin-top:auto;padding-top:4px;font-size:12.5px;font-weight:700;color:var(--brand)}
.adp-banner .adp-body{flex-direction:column;gap:0}
.adp-banner .adp-body img,.adp-banner .adp-noimg{width:100%;height:130px;min-height:0}
.adp-banner .adp-copy{padding:10px 14px 12px}

/* ---------- dialogs, notices, moderation ---------- */
.dialog-back{z-index:30;align-items:center}
.dialog{max-width:460px}
.dialog h2{font-size:21px;margin-bottom:6px}
.dialog-msg{margin:0;color:var(--text-dim);font-size:14.5px}
.notice{position:fixed;right:20px;bottom:20px;z-index:40;max-width:380px;padding:12px 16px;border-radius:var(--r);
  background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.notice.error{background:#9C1C36}
.nav-badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:8px;border-radius:999px;background:var(--rhodo);
  color:#fff;font-size:11.5px;font-weight:700;line-height:20px;text-align:center}
.report-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px 18px;margin-bottom:14px}
.report-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;margin-bottom:10px}
.report-reasons{display:flex;gap:6px;flex-wrap:wrap}
.pill.REPORT{background:#FCE9EC;color:#9C1C36}
.report-body{display:flex;gap:14px;align-items:flex-start}
.report-body img{width:120px;height:84px;object-fit:cover;border-radius:8px;flex:none;background:var(--surface-2)}
.report-content{min-width:0}
.report-content h3{font-size:17px;margin:2px 0 4px}
.report-content p{margin:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.report-kind{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.vis{text-transform:none;letter-spacing:0}
.vis.live{color:var(--green)}
