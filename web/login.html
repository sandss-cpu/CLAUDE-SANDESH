<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<title>Sign in — Batoma</title>
<meta name="theme-color" content="#5B3FA8">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/css/fonts.css">
<script src="config.js"></script>
<style>
/* Same "Prayer Flag" tokens as index.html, trimmed to what this page needs. */
:root{
  --saffron:#F4A024; --dusk:#5B3FA8; --rhodo:#E8455F;
  --ink:#1C1A2E; --paper:#FDFAF3; --green:#3E9B4F;
  --bg:var(--paper); --surface:#fff; --surface-2:#F6F1E6; --text:var(--ink); --text-dim:#5A5568; --line:#E4DED0;
  --brand:var(--dusk); --accent:var(--saffron);
  --r:14px; --tap:48px; --pad:18px;
  --shadow:0 2px 10px rgba(28,26,46,.07), 0 12px 34px rgba(28,26,46,.06);
  --font-display:'Fraunces',Georgia,serif; --font-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[data-theme="night"]{
  --bg:#141024; --surface:#1E1834; --surface-2:#271F42; --text:#EDE7F7; --text-dim:#A79BC4; --line:#332A52;
  --brand:#8B6FD4; --accent:#E8A33F; --shadow:0 2px 10px rgba(0,0,0,.4);
}
html[data-theme="sun"]{
  --bg:#fff; --surface:#fff; --surface-2:#F0EDE4; --text:#000; --text-dim:#2A2A2A; --line:#000;
  --brand:#3A2270; --accent:#B96A00; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:17px;line-height:1.6;display:flex;align-items:center;justify-content:center;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
}
main{width:100%;max-width:400px}
h1{font-family:var(--font-display);font-size:27px;margin:0 0 4px;font-weight:700;line-height:1.2}
p.sub{color:var(--text-dim);margin:0 0 20px;font-size:15px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--text-dim)}
input{
  width:100%;min-height:var(--tap);background:var(--surface);color:var(--text);
  border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;font:inherit;font-size:16px;
}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{
  min-height:var(--tap);border-radius:var(--r);padding:0 20px;font-weight:700;font-size:15.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:none;margin-top:18px;background:var(--accent);color:#231600;cursor:pointer;text-decoration:none;font-family:inherit;
}
.btn:disabled{opacity:.55;cursor:default}
.btn-ghost{background:transparent;color:var(--brand);font-weight:600;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:var(--pad);margin-top:18px;font-size:15px}
.devcode{font-size:22px;font-weight:700;letter-spacing:.12em;color:var(--brand);margin-top:6px}
.devlink{display:inline-block;margin-top:8px;color:var(--brand);font-weight:700;word-break:break-all}
.error{background:#FCE9EC;color:#9C1C36;border-radius:var(--r);padding:10px 14px;font-size:14px;margin-top:14px}
.ok{background:#E4F3E7;color:#1F6B30;border-radius:var(--r);padding:10px 14px;font-size:14px;margin-top:14px}
html[data-theme="night"] .error{background:#3A1420;color:#F4B4C1}
html[data-theme="night"] .ok{background:#16301C;color:#A9DDB4}
.back{display:inline-block;margin-bottom:18px;color:var(--text-dim);font-size:14px;text-decoration:none}
.tabs{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;margin:0 0 20px}
.tabs button{flex:1;min-height:40px;border:none;background:none;border-radius:999px;font:inherit;
  font-weight:700;font-size:14.5px;color:var(--text-dim);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;
  color:var(--brand);font:inherit;font-size:13px;font-weight:700;padding:8px;cursor:pointer}
.row{display:flex;justify-content:flex-end;margin-top:8px}
.link{background:none;border:none;color:var(--brand);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px 0}
.hint{font-size:12.5px;color:var(--text-dim);margin-top:6px}
.hint.center{text-align:center;margin-top:18px}
.codes{font-family:ui-monospace,Menlo,monospace;font-size:16px;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:10px 0}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);
  animation:spin .8s linear infinite;margin:10px 0}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Back to Batoma</a>
  <div id="view" aria-live="polite"></div>
</main>
<script src="/js/actions.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
