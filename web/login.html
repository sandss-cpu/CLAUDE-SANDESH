<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in — Bato</title>
<meta name="theme-color" content="#5B3FA8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same "Prayer Flag" tokens as index.html, trimmed to what this page needs. */
:root{
  --saffron:#F4A024; --dusk:#5B3FA8; --rhodo:#E8455F;
  --ink:#1C1A2E; --paper:#FDFAF3; --green:#3E9B4F;
  --bg:var(--paper); --surface:#fff; --text:var(--ink); --text-dim:#5A5568; --line:#E4DED0;
  --brand:var(--dusk); --accent:var(--saffron);
  --r:14px; --tap:48px; --pad:18px;
  --shadow:0 2px 10px rgba(28,26,46,.07), 0 12px 34px rgba(28,26,46,.06);
  --font-display:'Fraunces',Georgia,serif; --font-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:17px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px;
}
main{width:100%;max-width:380px}
h1{font-family:var(--font-display);font-size:26px;margin:0 0 4px;font-weight:700}
p.sub{color:var(--text-dim);margin:0 0 22px;font-size:15px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--text-dim)}
input{
  width:100%;min-height:var(--tap);background:var(--surface);color:var(--text);
  border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;font:inherit;font-size:16px;
}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{
  min-height:var(--tap);border-radius:var(--r);padding:0 20px;font-weight:700;font-size:15.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:none;margin-top:18px;background:var(--accent);color:#231600;cursor:pointer;
}
.btn:disabled{opacity:.55;cursor:default}
.btn-ghost{background:transparent;color:var(--brand);font-weight:600;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:var(--pad);margin-top:18px}
.hint{font-size:13px;color:var(--text-dim);margin-top:8px}
.devcode{font-size:22px;font-weight:700;letter-spacing:.12em;color:var(--brand);margin-top:6px}
.error{background:#FCE9EC;color:#9C1C36;border-radius:var(--r);padding:10px 14px;font-size:14px;margin-top:14px}
html[data-theme="night"] .error{background:#3A1420;color:#F4B4C1}
.back{display:inline-block;margin-bottom:18px;color:var(--text-dim);font-size:14px;text-decoration:none}
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Back to Bato</a>
  <div id="view"></div>
</main>
<script>
const API = localStorage.getItem('bato.api') || 'http://localhost:3000/api/v1';
const params = new URLSearchParams(location.search);
const returnTo = params.get('returnTo') || 'index.html#write';

const state = { step: 'phone', phone: '', devCode: '', error: '', busy: false };

const $ = (s) => document.querySelector(s);
const esc = (s='') => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body){
  const res = await fetch(`${API}${path}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(json?.message || json?.error?.message || 'Something went wrong. Try again.');
  return json.data;
}

function render(){
  $('#view').innerHTML = VIEWS[state.step]();
}

const VIEWS = {
  phone(){
    return `
      <h1>Sign in to vlog</h1>
      <p class="sub">Enter your phone number and we'll send you a code.</p>
      <form onsubmit="submitPhone(event)">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" inputmode="numeric" placeholder="98XXXXXXXX"
               value="${esc(state.phone)}" autofocus required>
        ${state.error ? `<div class="error">${esc(state.error)}</div>` : ''}
        <button class="btn" type="submit" ${state.busy ? 'disabled' : ''}>
          ${state.busy ? 'Sending…' : 'Send code'}
        </button>
      </form>`;
  },
  code(){
    return `
      <h1>Enter the code</h1>
      <p class="sub">We sent a 6-digit code to ${esc(state.phone)}.</p>
      ${state.devCode ? `
        <div class="card">
          No SMS gateway configured on this server — here is the code:
          <div class="devcode">${esc(state.devCode)}</div>
        </div>` : ''}
      <form onsubmit="submitCode(event)">
        <label for="code">6-digit code</label>
        <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               placeholder="123456" autofocus required>
        ${state.error ? `<div class="error">${esc(state.error)}</div>` : ''}
        <button class="btn" type="submit" ${state.busy ? 'disabled' : ''}>
          ${state.busy ? 'Checking…' : 'Sign in'}
        </button>
      </form>
      <button class="btn btn-ghost" type="button" onclick="state.step='phone';state.error='';render()">
        Use a different number
      </button>`;
  },
  mfaRequired(){
    return `
      <h1>This account needs the admin panel</h1>
      <p class="sub">
        Accounts with editorial or admin permissions must sign in with an authenticator app,
        which this traveller sign-in page doesn't handle.
      </p>
      <a class="btn" href="admin.html">Go to the admin panel</a>
      <button class="btn btn-ghost" type="button" onclick="state.step='phone';state.error='';render()">
        Use a different number
      </button>`;
  },
};

async function submitPhone(e){
  e.preventDefault();
  state.phone = $('#phone').value.trim();
  state.error = ''; state.busy = true; render();
  try{
    const data = await api('/auth/otp/request', { phone: state.phone });
    state.devCode = data.devCode || '';
    state.busy = false; state.step = 'code'; render();
  }catch(err){
    state.busy = false; state.error = err.message; render();
  }
}

async function submitCode(e){
  e.preventDefault();
  const code = $('#code').value.trim();
  state.error = ''; state.busy = true; render();
  try{
    const data = await api('/auth/otp/verify', { phone: state.phone, code });
    if(data.mfaRequired){
      state.busy = false; state.step = 'mfaRequired'; render();
      return;
    }
    localStorage.setItem('bato.auth', JSON.stringify({
      accessToken: data.accessToken, refreshToken: data.refreshToken, user: data.user,
    }));
    location.href = returnTo;
  }catch(err){
    state.busy = false; state.error = err.message; render();
  }
}

render();
</script>
</body>
</html>
