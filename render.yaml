# Render Blueprint for Batoma: the API, the app, the public website, managed Postgres,
# and a weekly encrypted backup. Deploy: Render dashboard → New → Blueprint → this
# repository. GO_LIVE.md is the checklist; SECURITY.md explains the keys.
#
# Domains (fill in <PUBLIC_DOMAIN> once, before any sticker is printed):
#   https://<PUBLIC_DOMAIN>          bato-site: the public website
#   https://<PUBLIC_DOMAIN>/b/<code> the permanent QR short link (bato-site redirects it to the app)
#   https://app.<PUBLIC_DOMAIN>      bato-web: the reader, owner portal, partner area, control panel
#   https://app.<PUBLIC_DOMAIN>/api  the API, through bato-web's rewrite (one origin for the app)
#   https://media.<PUBLIC_DOMAIN>    the public bucket (R2 custom domain) for pictures
#
# Entries marked `sync: false` are filled in on the dashboard. The API refuses to start
# until every production setting is right (backend/src/config/env.validation.ts).

databases:
  - name: batoma-db
    databaseName: batoma
    user: batoma
    region: singapore          # closest Render region to Nepal
    # A paid plan: point-in-time recovery is what makes a bad migration or a deleted row
    # recoverable to the minute. Check the plan includes it before choosing.
    plan: basic-1gb
    postgresMajorVersion: "16"
    ipAllowList: []            # reachable only from Render services in this account

services:
  - type: web
    name: bato-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    # --include=dev: the Nest and Prisma CLIs and ts-node are dev dependencies.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations, then the website's read-only role, then any personal field not yet
    # encrypted (safe to repeat; it only touches what needs it).
    preDeployCommand: npx prisma migrate deploy && npm run db:site-role && npm run fields:encrypt
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: batoma-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_EXPIRES_DAYS
        value: "60"
      # Requests reach the API through bato-web's rewrite and Render's own proxy. Check the
      # count with GO_LIVE.md step 6 (two addresses must show as two in Security events).
      - key: TRUST_PROXY
        value: "2"
      - key: PHONE_LOGIN_ENABLED
        value: "false"
      # Field encryption (SECURITY.md). Render generates them; copy both into the team's
      # password manager the day they are made: losing them loses the encrypted fields.
      - key: FIELD_ENCRYPTION_KEYS
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true
      - key: SIGNED_URL_SECRET
        generateValue: true
      # https://app.<PUBLIC_DOMAIN>
      - key: PUBLIC_WEB_URL
        sync: false
      # https://app.<PUBLIC_DOMAIN> (the app calls the API on its own origin)
      - key: CORS_ORIGINS
        sync: false
      # https://app.<PUBLIC_DOMAIN>: offline packs are cached under the address the reader calls
      - key: API_PUBLIC_URL
        sync: false
      # https://<PUBLIC_DOMAIN>: printed on every sticker, never changed afterwards
      - key: SHORT_LINK_BASE
        sync: false
      # The public website, and the key it shares with this API (forms, cache purges)
      - key: SITE_URL
        sync: false
      - key: SITE_API_KEY
        generateValue: true
      - key: SITE_DB_PASSWORD
        generateValue: true
      - key: ADMIN_INBOX
        sync: false
      # Files: Cloudflare R2 (or any S3-compatible store). Two buckets: private (statement
      # photos, verification documents) and public (pictures, served from MEDIA_BASE_URL).
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false            # https://<account id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_BASE_URL
        sync: false            # https://media.<PUBLIC_DOMAIN>
      # Email: any SMTP provider (Resend, Brevo, Mailgun, Amazon SES…)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false            # "Batoma <no-reply@<PUBLIC_DOMAIN>>"
      - key: SENTRY_DSN
        sync: false            # optional

  - type: web
    name: bato-site
    runtime: node
    region: singapore
    plan: starter
    rootDir: site
    # prepare.mjs copies the schema, fonts and icons in from ../backend and ../web.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # The read-only batoma_site role: address from the database, password from the API
      - key: SITE_DB_HOST
        fromDatabase: { name: batoma-db, property: host }
      - key: SITE_DB_PORT
        fromDatabase: { name: batoma-db, property: port }
      - key: SITE_DB_NAME
        fromDatabase: { name: batoma-db, property: database }
      - key: SITE_DB_PASSWORD
        fromService: { type: web, name: bato-api, envVarKey: SITE_DB_PASSWORD }
      - key: SITE_API_KEY
        fromService: { type: web, name: bato-api, envVarKey: SITE_API_KEY }
      - key: SITE_EVENT_SALT
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # https://<PUBLIC_DOMAIN>
      - key: SITE_URL
        sync: false
      # https://app.<PUBLIC_DOMAIN>
      - key: APP_URL
        sync: false
      # The API's own Render address, for server-to-server form posts: https://bato-api.onrender.com/api/v1
      - key: API_URL
        sync: false

  - type: web
    name: bato-web
    runtime: static
    rootDir: web
    # The app calls the API on its own origin (/api/v1, rewritten below); the website's
    # address is used for links to a partner's page.
    buildCommand: >-
      printf 'window.BATO_CONFIG = { api: "/api/v1", site: "%s" };\n' "$BATO_SITE_URL" > config.js
    staticPublishPath: .
    routes:
      # Printed stickers open /b/<code> (older ones /r/<code>). Neither is a file: the reader
      # reads the code from the path. Never change these paths once stickers are printed.
      - type: rewrite
        source: /b/*
        destination: /index.html
      - type: rewrite
        source: /r/*
        destination: /index.html
      # The API on the app's own origin: no CORS preflight and one less TLS handshake on a
      # weak signal. Set the destination to bato-api's address as Render shows it.
      - type: rewrite
        source: /api/*
        destination: https://bato-api.onrender.com/api/*
    envVars:
      # https://<PUBLIC_DOMAIN>
      - key: BATO_SITE_URL
        sync: false
    # Generated from scripts/web-headers.mjs, which the local server uses too; a test
    # (backend/src/common/utils/web-pages.spec.ts) checks the two still agree.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Two years, subdomains included: ready for the HSTS preload list once the domain is final.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      # The camera is for scan.html alone; location only where the reader can send it with
      # an SOS. Pages are listed one by one so no two rules for this header ever overlap.
      - path: /
        name: Permissions-Policy
        value: camera=(), geolocation=(self), microphone=(), payment=(), usb=()
      - path: /index.html
        name: Permissions-Policy
        value: camera=(), geolocation=(self), microphone=(), payment=(), usb=()
      - path: /b/*
        name: Permissions-Policy
        value: camera=(), geolocation=(self), microphone=(), payment=(), usb=()
      - path: /r/*
        name: Permissions-Policy
        value: camera=(), geolocation=(self), microphone=(), payment=(), usb=()
      - path: /login.html
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /admin.html
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /owner.html
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /business.html
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /bus.html
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /creator.html
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /preview.html
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /scan.html
        name: Permissions-Policy
        value: camera=(self), geolocation=(), microphone=(), payment=(), usb=()
      # No inline script anywhere (web-pages.spec.ts checks every page and script), so
      # script-src is 'self' alone: an injected handler or <script> does not run.
      # style-src keeps 'unsafe-inline' for style attributes, which cannot run code.
      # connect-src is 'self': the app calls the API through its own domain (/api/*).
      # img-src and media-src allow https: for the public bucket's address, set per deploy.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          base-uri 'self';
          object-src 'none';
          frame-ancestors 'none';
          form-action 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          font-src 'self';
          img-src 'self' data: blob: https:;
          media-src 'self' blob: https:;
          connect-src 'self';
          worker-src 'self';
          manifest-src 'self';
          upgrade-insecure-requests
      # Pages, the service worker and config must be revalidated on every visit,
      # or readers keep running an old build after a deploy.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
      # Scripts revalidate too: a page from a new deploy running an old script (or the
      # other way round) breaks in ways nobody can reproduce.
      - path: /*.js
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      - path: /css/*
        name: Cache-Control
        value: no-cache
      # Font files are versioned by their package and never change under the same name.
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # Weekly encrypted logical backup, on top of the database's point-in-time recovery.
  # Monday 02:15 in Kathmandu. SECURITY.md has the restore drill.
  - type: cron
    name: batoma-backup
    runtime: docker
    region: singapore
    dockerfilePath: ./ops/backup/Dockerfile
    dockerContext: ./ops/backup
    schedule: "30 20 * * 0"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: batoma-db, property: connectionString }
      # An age public key ("age1…"); the matching private key is kept offline.
      - key: BACKUP_AGE_RECIPIENT
        sync: false
      - key: BACKUP_BUCKET
        sync: false            # a third, private bucket, separate from the app's
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
